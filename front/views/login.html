<div class="col-md-5 mx-auto">
  <h2>Entrar</h2>
  <div class="alert alert-danger" ng-if="erro">{{ erro }}</div>
  <form ng-submit="entrar()">
    <input type="email" class="form-control mb-3" placeholder="E-mail" ng-model="dados.email" required>
    <input type="password" class="form-control mb-3" placeholder="Senha" ng-model="dados.password" required>
    <button class="btn btn-primary w-100">Entrar</button>
  </form>
</div>
