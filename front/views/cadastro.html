<div class="auth-card">
  <h2>Criar conta</h2>
  <div class="alert alert-danger" ng-if="erro">{{ erro }}</div>
  <form ng-submit="cadastrar()">
    <input class="form-control mb-3" placeholder="Nome" ng-model="dados.name" required>
    <input type="email" class="form-control mb-3" placeholder="E-mail" ng-model="dados.email" required>
    <input type="password" class="form-control mb-3" placeholder="Senha (mín. 6 caracteres)"
           ng-model="dados.password" required>
    <button class="btn btn-primary w-100">Cadastrar</button>
  </form>
  <p class="text-center mt-3 mb-0"><small>Já tem conta? <a href="#/login">Entrar</a></small></p>
</div>
