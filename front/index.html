<!doctype html>
<html lang="pt-BR" ng-app="blog">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog de NodeJS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.4.9/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.4.9/angular-route.min.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark shadow-sm mb-4" ng-controller="NavCtrl">
    <div class="container d-flex justify-content-between">
      <a href="#/" class="navbar-brand"><strong>Blog em NodeJS</strong></a>
      <div>
        <span ng-if="Auth.user()" class="text-white me-3">Olá, {{ Auth.user().name }}</span>
        <a ng-if="Auth.user()" href="#/novo" class="btn btn-sm btn-success me-2">Nova postagem</a>
        <button ng-if="Auth.user()" class="btn btn-sm btn-outline-light" ng-click="sair()">Sair</button>
        <a ng-if="!Auth.user()" href="#/login" class="btn btn-sm btn-outline-light me-2">Entrar</a>
        <a ng-if="!Auth.user()" href="#/cadastro" class="btn btn-sm btn-primary">Cadastrar</a>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <ng-view></ng-view>
  </main>
</body>
</html>
