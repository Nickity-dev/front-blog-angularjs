<!doctype html>
<html lang="pt-BR" ng-app="blog">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog em NodeJS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.4.9/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.4.9/angular-route.min.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <header class="masthead" ng-controller="NavCtrl">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="#/" class="navbar-brand">Blog em NodeJS</a>
      <div class="d-flex align-items-center gap-2">
        <span ng-if="Auth.user()" class="user-tag me-3">Olá, {{ Auth.user().name }}</span>
        <a ng-if="Auth.user()" href="#/novo" class="btn btn-sm btn-primary me-2">Nova postagem</a>
        <button ng-if="Auth.user()" class="btn btn-sm btn-outline-light" ng-click="sair()">Sair</button>
        <a ng-if="!Auth.user()" href="#/login" class="btn btn-sm btn-outline-light me-2">Entrar</a>
        <a ng-if="!Auth.user()" href="#/cadastro" class="btn btn-sm btn-primary">Cadastrar</a>
      </div>
    </div>
  </header>

  <main class="container">
    <ng-view></ng-view>
  </main>

  <footer class="site-footer">
    <div class="container">Blog em NodeJS — feito com AngularJS</div>
  </footer>
</body>
</html>
